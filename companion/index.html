<body><main><h1>三青 AI 本機配對</h1><p>這是你電腦裡的控制頁，不是正式網站登入頁，不需要輸入密碼。</p>
<p>只允許 <a href="https://omega-ten-20.vercel.app" target="_blank" rel="noopener noreferrer">三青正式網站</a> 配對。先在正式網站登入、按右下角 AI 的「連接這台電腦」，再回這裡核對帳號與配對編號。</p>
<section><h2>等待你的確認</h2><div id="pending">正在讀取…</div></section>
<section><p id="connected"></p><p>同意配對會讓該登入使用本機文件庫。只確認你自己剛剛發起的請求；新配對會取代舊配對。</p><button id="revoke" type="button">中斷所有配對</button><button id="stop" type="button">停止本機 AI</button></section><p id="status" role="status"></p>
